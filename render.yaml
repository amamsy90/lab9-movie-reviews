# Release config for the ai service. It does not use PostgreSQL.
# Other owners can add their services here.
services:
  - type: web
    name: lab9-ai
    runtime: docker
    dockerfilePath: ./services/ai/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
  # reviews: CSV import and per-movie counts. Calls ai and data over their URLs.
  - type: web
    name: lab9-reviews
    runtime: docker
    plan: free
    dockerfilePath: ./services/reviews/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: AI_URL
        value: https://lab9-ai.onrender.com
      - key: DATA_URL
        value: https://lab9-data.onrender.com
