# Release config. These services do not receive database credentials.
services:
  - type: web
    name: lab9-ai
    runtime: docker
    dockerfilePath: ./services/ai/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
  # reviews: CSV import and per-movie counts. Calls ai and data over their URLs.
  - type: web
    name: lab9-reviews
    runtime: docker
    plan: free
    dockerfilePath: ./services/reviews/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: AI_URL
        value: https://lab9-ai.onrender.com
      - key: DATA_URL
        value: https://lab9-data.onrender.com
  - type: web
    name: lab9-movie-reviews
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/web/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATA_URL
        sync: false
      - key: AI_URL
        sync: false
      - key: REVIEWS_URL
        sync: false
