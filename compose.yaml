services:
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    restart: unless-stopped
    environment:
      DATA_URL: http://data:8000
      AI_URL: http://ai:8000
      REVIEWS_URL: http://reviews:8000
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8000"
    depends_on:
      data:
        condition: service_healthy
      ai:
        condition: service_healthy
      reviews:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  reviews:
    build:
      context: .
      dockerfile: services/reviews/Dockerfile
    restart: unless-stopped
    environment:
      AI_URL: http://ai:8000
      DATA_URL: http://data:8000
    depends_on:
      data:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  data:
    build:
      context: .
      dockerfile: services/data/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: helpdesk
      DB_USER: helpdesk
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  database:
